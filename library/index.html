<style>
  /* 夜の箱庭を窓から覗く。文字は雪明かりの色、差し色はストーブと街灯の橙だけ */
  :root {
    --ink: #0a0f18;
    --veil: rgba(9, 13, 21, 0.62);
    --snow: #e7ecf3;
    --frost: #98aac3;
    --lamp: #f2b562;
    --lamp-soft: rgba(242, 181, 98, 0.16);
    --line: rgba(231, 236, 243, 0.16);
    --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--snow); overflow: hidden; }
  body { font-family: var(--body); -webkit-font-smoothing: antialiased; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#gl:active { cursor: grabbing; }
  #fade { position: fixed; inset: 0; background: var(--ink); opacity: 1; pointer-events: none; transition: opacity 0.6s ease; }

  .title {
    position: fixed; top: calc(20px + env(safe-area-inset-top, 0px)); right: 22px;
    display: flex; flex-direction: row-reverse; gap: 10px; align-items: flex-start;
    pointer-events: none; text-shadow: 0 0 18px rgba(0, 0, 0, 0.6);
  }
  .title h1 {
    writing-mode: vertical-rl; margin: 0; font-family: var(--display); font-weight: 700;
    font-size: clamp(24px, 3.4vw, 40px); letter-spacing: 0.32em; line-height: 1;
  }
  .title p {
    writing-mode: vertical-rl; margin: 0.4em 0 0; font-family: var(--display); font-weight: 500;
    font-size: 13px; letter-spacing: 0.3em; color: var(--frost);
  }
  .meta {
    position: fixed; top: calc(20px + env(safe-area-inset-top, 0px)); left: 20px;
    font-size: 12px; letter-spacing: 0.12em; color: var(--frost);
    display: flex; flex-direction: column; gap: 4px; pointer-events: none;
    font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
  }
  .meta b { font-weight: 500; color: var(--snow); }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 20px calc(18px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    pointer-events: none;
    background: linear-gradient(to top, rgba(6, 9, 15, 0.7), rgba(6, 9, 15, 0));
    padding-top: 60px;
  }
  .caption { display: flex; gap: 14px; align-items: flex-start; min-width: 0; max-width: 34em; text-shadow: 0 0 14px rgba(0, 0, 0, 0.8); }
  .caption .no { font-family: var(--display); font-size: 15px; color: var(--lamp); padding-top: 9px; }
  .caption h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(22px, 2.6vw, 30px); letter-spacing: 0.24em; }
  .caption p { margin: 4px 0 0; font-size: 13px; line-height: 1.7; color: var(--frost); letter-spacing: 0.04em; }

  .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: auto; min-width: 0; }
  nav#views { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
  nav#views button, #tour {
    font: inherit; font-size: 13px; letter-spacing: 0.1em; color: var(--snow);
    background: var(--veil); border: 1px solid var(--line); border-radius: 2px;
    padding: 7px 11px 6px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: border-color 0.2s, background 0.2s, color 0.2s;
  }
  nav#views button span { font-family: var(--display); color: var(--frost); margin-right: 0.45em; }
  nav#views button:hover, #tour:hover { border-color: rgba(242, 181, 98, 0.55); }
  nav#views button[aria-current="true"] { border-color: var(--lamp); background: var(--lamp-soft); }
  nav#views button[aria-current="true"] span { color: var(--lamp); }
  button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
  .row2 { display: flex; gap: 10px; align-items: center; }
  #tour[aria-pressed="true"] { border-color: var(--lamp); color: var(--lamp); }

  #loading {

    transition: opacity 0.8s ease;
  }
  body.hide-ui .title, body.hide-ui .meta, body.hide-ui .bottom { display: none; }

  @media (max-width: 720px) {

    .meta { left: 16px; font-size: 11px; }
    .bottom { padding-left: 16px; padding-right: 16px; flex-direction: column; align-items: stretch; }
    .controls { align-items: stretch; }
    nav#views { justify-content: flex-start; }
    nav#views button { padding: 6px 8px 5px; font-size: 12px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #fade { transition: none; } }
</style>

<canvas id="gl" aria-label="雪に埋もれた図書館の箱庭"></canvas>

<header class="title">
  <h1>雪籠りの図書館</h1>

</header>

<div class="meta" aria-live="off">
  <span id="clock">午後五時十二分</span>

</div>

<div class="bottom">

      <button id="tour" type="button" aria-pressed="false">巡回</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   雪籠りの図書館
   画像も 3D モデルも使わない。建物・本・人・雪・光はすべてここで作る。
   URL の引数：view=1..7（最初の視点） t=秒（時刻を止める。撮影用） ui=0（文字を隠す）
   ============================================================ */

const Q = new URLSearchParams(location.search);
const FIXED_T = Q.has('t') ? parseFloat(Q.get('t')) : null;
const START_VIEW = Math.min(6, Math.max(0, (parseInt(Q.get('view') || '1', 10) || 1) - 1));
if (Q.get('ui') === '0') document.body.classList.add('hide-ui');

// ---------- 乱数と雑音（毎回同じ箱庭になるよう種を固定） ----------
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry(20261207);
const R = (a = 0, b = 1) => a + (b - a) * rnd();
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  const ab = a + (b - a) * u, cd = c + (d - c) * u;
  return ab + (cd - ab) * v;
}
function fbm(x, y, o = 4) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < o; i++) { s += a * (vnoise(x * f, y * f) * 2 - 1); f *= 2.03; a *= 0.5; }
  return s;
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const PI = Math.PI, TAU = Math.PI * 2;

// ---------- 画面 ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0x27334b);
scene.fog = new THREE.FogExp2(FOG_COLOR.clone(), 0.02);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.08, 420);

// ---------- 建物の寸法（外壁の外面） ----------
const MAIN = { x0: -8, x1: 8, z0: -6, z1: 4, t: 0.25, floor: 0.35, eave: 7.0, ridgeZ: -1, ridgeY: 10.4, slope: 0.68 };
const KURA = { x0: 11, x1: 18, z0: -6, z1: 1, t: 0.45, floor: 0.55, eave: 5.2, ridgeZ: -2.5, ridgeY: 7.3, slope: 0.6 };
const CORR = { x0: 8, x1: 11, z0: -3.2, z1: -0.4, t: 0.15, floor: 0.35, eave: 3.0, ridgeZ: -1.8, ridgeY: 3.55, slope: 0.4 };

/* ---------- 屋内と屋外の光を分ける ----------
   壁に影を落とさない安い灯りは壁を素通りする。そこで描くときに「この点はどの部屋か」を調べ、
   灯りごとに決めた部屋の中だけを照らす。月明かりと空の光は屋内では弱める。 */
const MAXL = 24;
const ZU = {
  uZMin: { value: [
    new THREE.Vector3(MAIN.x0 + 0.2, -1, MAIN.z0 + 0.2),
    new THREE.Vector3(CORR.x0 - 0.3, -1, CORR.z0 + 0.1),
    new THREE.Vector3(KURA.x0 + KURA.t - 0.05, -1, KURA.z0 + KURA.t - 0.05) ] },
  uZMax: { value: [
    new THREE.Vector3(MAIN.x1 - 0.2, 12, MAIN.z1 - 0.2),
    new THREE.Vector3(CORR.x1 + 0.4, 4, CORR.z1 - 0.1),
    new THREE.Vector3(KURA.x1 - KURA.t + 0.05, 9, KURA.z1 - KURA.t + 0.05) ] },
  uZRoof: { value: [
    new THREE.Vector4(MAIN.ridgeY - 0.02, MAIN.ridgeZ, MAIN.slope, 1),
    new THREE.Vector4(CORR.ridgeY - 0.04, CORR.ridgeZ, CORR.slope, 1),
    new THREE.Vector4(KURA.ridgeY - 0.02, KURA.ridgeZ, KURA.slope, 2) ] },
  uLZ: { value: new Float32Array(MAXL).fill(-1) },
  uIndoorSky: { value: 0.22 },
  uTime: { value: 0 },
};
const ZONE_GLSL = /* glsl */ `
  uniform vec3 uZMin[3]; uniform vec3 uZMax[3]; uniform vec4 uZRoof[3];
  uniform float uLZ[${MAXL}];
  uniform float uIndoorSky;
  uniform float uTime;
  varying vec3 vWPos;
  varying vec3 vWNrm;
  float zId;
  float zoneOf(vec3 p) {
    for (int k = 0; k < 3; k++) {
      if (all(greaterThan(p, uZMin[k])) && all(lessThan(p, uZMax[k])) &&
          p.y < uZRoof[k].x - uZRoof[k].z * abs(p.z - uZRoof[k].y)) return uZRoof[k].w;
    }
    return 0.0;
  }
  float lzMask(float lz) { return (lz < -0.5 || abs(lz - zId) < 0.5) ? 1.0 : 0.0; }
`;
const LIGHTS_CHUNK = THREE.ShaderChunk.lights_fragment_begin
  .replace('getPointLightInfo( pointLight, geometryPosition, directLight );',
    'getPointLightInfo( pointLight, geometryPosition, directLight ); directLight.color *= lzMask( uLZ[ i ] );')
  .replace('getSpotLightInfo( spotLight, geometryPosition, directLight );',
    'getSpotLightInfo( spotLight, geometryPosition, directLight ); directLight.color *= ( zId < 0.5 ? 1.0 : 0.0 );')
  .replace('getDirectionalLightInfo( directionalLight, directLight );',
    'getDirectionalLightInfo( directionalLight, directLight ); directLight.color *= ( zId < 0.5 ? 1.0 : 0.0 );')
  .replace('irradiance += getHemisphereLightIrradiance( hemisphereLights[ i ], geometryNormal );',
    'irradiance += getHemisphereLightIrradiance( hemisphereLights[ i ], geometryNormal ) * ( zId < 0.5 ? 1.0 : uIndoorSky );');

// 標準の材質に「部屋分け」「世界座標の模様（三方向から貼る）」「雪のきらめき」を差し込む
function patch(mat, opt = {}) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, ZU);
    if (opt.tri) {
      sh.uniforms.tTri = { value: opt.tri };
      sh.uniforms.uTriScale = { value: opt.triScale || 0.5 };
      sh.uniforms.uTriAmt = { value: opt.triAmt ?? 1 };
    }
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\nvarying vec3 vWNrm;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 zwp = vec4( transformed, 1.0 );
        vec3 zwn = objectNormal;
        #ifdef USE_INSTANCING
          zwp = instanceMatrix * zwp; zwn = mat3( instanceMatrix ) * zwn;
        #endif
        vWPos = ( modelMatrix * zwp ).xyz;
        vWNrm = normalize( mat3( modelMatrix ) * zwn );`);
    let fs = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + ZONE_GLSL +
        (opt.tri ? `
        uniform sampler2D tTri; uniform float uTriScale; uniform float uTriAmt;
        float triTex(vec3 p, vec3 n) {
          vec3 w = pow(abs(n), vec3(4.0)); w /= (w.x + w.y + w.z);
          float a = texture2D(tTri, p.zy * uTriScale).r;
          float b = texture2D(tTri, p.xz * uTriScale).r;
          float c = texture2D(tTri, p.xy * uTriScale).r;
          return a * w.x + b * w.y + c * w.z;
        }` : ''))
      .replace('void main() {', 'void main() {\n zId = zoneOf( vWPos );')
      .replace('#include <lights_fragment_begin>', LIGHTS_CHUNK);
    if (opt.tri) {
      fs = fs.replace('#include <color_fragment>', `#include <color_fragment>
        diffuseColor.rgb *= mix( 1.0, triTex( vWPos, normalize( vWNrm ) ) * 1.25, uTriAmt );`);
    }
    if (opt.sparkle) {
      fs = fs.replace('#include <opaque_fragment>', `
        {
          vec3 cell = floor( vWPos * 26.0 );
          float h = fract( sin( dot( cell, vec3( 12.9898, 78.233, 37.719 ) ) ) * 43758.5453 );
          vec3 vd = normalize( cameraPosition - vWPos );
          float tw = fract( sin( dot( cell + floor( vd * 9.0 ), vec3( 4.1, 7.7, 1.3 ) ) ) * 9631.17 );
          float g = step( 0.985, h ) * smoothstep( 0.55, 1.0, tw ) * smoothstep( 0.2, 0.9, normalize( vWNrm ).y );
          float lum = dot( totalDiffuse, vec3( 0.3, 0.5, 0.2 ) );
          outgoingLight += vec3( 0.9, 0.95, 1.0 ) * g * ( 0.25 + 6.0 * lum );
        }
        #include <opaque_fragment>`);
    }
    sh.fragmentShader = fs;
  };
  mat.customProgramCacheKey = () => 'z' + (opt.tri ? 't' : '') + (opt.sparkle ? 's' : '') + (opt.key || '');
  return mat;
}

// ---------- 手で描く模様（canvas） ----------
function canvasTex(w, h, draw, opt = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = opt.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = opt.clamp ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
// 板張り（下見板・床板・棚板）。灰色の濃淡だけで、色は頂点色が持つ
const texBoards = canvasTex(512, 512, (g, w, h) => {
  const n = 10, bh = h / n;
  for (let i = 0; i < n; i++) {
    const base = 200 + RI(-22, 22);
    g.fillStyle = `rgb(${base},${base},${base})`; g.fillRect(0, i * bh, w, bh);
    for (let k = 0; k < 70; k++) {
      const y = i * bh + R(2, bh - 2), v = base + RI(-30, 18);
      g.strokeStyle = `rgba(${v},${v},${v},0.5)`; g.lineWidth = R(0.5, 1.6);
      g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x * 0.02 + k) * R(0.3, 1.6));
      g.stroke();
    }
    // 板の継ぎ目（縦）と、板と板の間の影
    const jx = R(0, w);
    g.fillStyle = 'rgba(40,40,40,0.55)'; g.fillRect(jx, i * bh, 2, bh);
    g.fillStyle = 'rgba(30,30,30,0.85)'; g.fillRect(0, (i + 1) * bh - 3, w, 3);
    g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(0, i * bh, w, 1.5);
  }
}, { linear: true });
// 漆喰・布・雑多なものの細かい斑
const texMottle = canvasTex(256, 256, (g, w, h) => {
  const im = g.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = 200 + 40 * (vnoise(x * 0.06, y * 0.06) - 0.5) + 30 * (vnoise(x * 0.25 + 9, y * 0.25) - 0.5) + RI(-8, 8);
    const i = (y * w + x) * 4; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
}, { linear: true });
// 本の背：上下の帯と、ところどころの題箋
const texSpine = canvasTex(64, 256, (g, w, h) => {
  g.fillStyle = '#d0d0d0'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#777'; g.fillRect(0, 14, w, 10); g.fillRect(0, h - 26, w, 10);
  g.fillStyle = '#fff'; g.fillRect(0, 28, w, 3); g.fillRect(0, h - 31, w, 3);
  g.fillStyle = '#f2f2f2'; g.fillRect(10, 60, w - 20, 70);
  g.fillStyle = '#888';
  for (let i = 0; i < 5; i++) g.fillRect(w / 2 - 3, 70 + i * 11, 6, 6);
}, { linear: true });
// 窓の霜（縁ほど白い）
const texFrost = canvasTex(256, 256, (g, w, h) => {
  const im = g.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ex = Math.min(x, w - x) / w, ey = Math.min(y, h - y) / h;
    const e = Math.min(ex, ey * 1.3) + (h - y) / h * -0.05;
    const n = vnoise(x * 0.08, y * 0.08) * 0.6 + vnoise(x * 0.3, y * 0.3) * 0.4;
    let a = clamp((0.2 - e) * 6 + (n - 0.5) * 0.9, 0, 1);
    a = 0.07 + a * 0.85;
    const i = (y * w + x) * 4; im.data[i] = 235; im.data[i + 1] = 242; im.data[i + 2] = 255; im.data[i + 3] = a * 255;
  }
  g.putImageData(im, 0, 0);
}, { clamp: true });
// 土蔵の海鼠壁（黒い平瓦と白い目地の菱格子）
const texNamako = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#2b2f36'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 300; i++) { g.fillStyle = `rgba(255,255,255,${R(0.01, 0.04)})`; g.fillRect(R(0, w), R(0, h), R(2, 20), R(2, 20)); }
  g.strokeStyle = '#e9e6dc'; g.lineWidth = 9; g.lineCap = 'round';
  for (let k = -4; k <= 4; k++) {
    g.beginPath(); g.moveTo(k * 64, 0); g.lineTo(k * 64 + w, h); g.stroke();
    g.beginPath(); g.moveTo(k * 64 + w, 0); g.lineTo(k * 64, h); g.stroke();
  }
});
// 箱庭の土台の断面（雪・土・石の層）
const texSoil = canvasTex(512, 256, (g, w, h) => {
  const layers = [[0, 0.1, '#dfe6ef'], [0.1, 0.16, '#8c8f93'], [0.16, 0.45, '#4a3a2e'], [0.45, 0.7, '#3a2e26'], [0.7, 1, '#26201c']];

// 壁：窓や戸の穴を避けて、残りを箱で埋める。u は壁に沿う向き、穴は [u0,u1,y0,y1]
function wallRects(u0, u1, y0, y1, holes) {
  const us = new Set([u0, u1]);
  for (const h of holes) { us.add(clamp(h[0], u0, u1)); us.add(clamp(h[1], u0, u1)); }
  const xs = [...us].sort((a, b) => a - b), out = [];
  for (let i = 0; i < xs.length - 1; i++) {
    const a = xs[i], b = xs[i + 1];
    if (b - a < 1e-4) continue;
    const mid = (a + b) / 2;
    const hs = holes.filter((h) => h[0] < mid && h[1] > mid).map((h) => [h[2], h[3]]).sort((p, q) => p[0] - q[0]);
    let y = y0;
    for (const [ha, hb] of hs) { if (ha > y) out.push([a, b, y, ha]); y = Math.max(y, hb); }
    if (y < y1) out.push([a, b, y, y1]);
  }
  return out;
}

// 窓 1 枚：外枠・桟・ガラス・窓台（外の窓台には雪）。面の向きは +z が外（局所座標）
function windowUnit(w, h, opt = {}) {
  const fw = 0.08, depth = opt.depth ?? 0.3, cols = opt.cols ?? 2, rows = opt.rows ?? 3;
  const frame = opt.frame ?? MULLION;
  B.box('wood', frame, w + 0.16, fw + 0.02, depth + 0.06, 0, h / 2 + fw / 2, 0);
  B.box('wood', frame, w + 0.16, fw, depth + 0.06, 0, -h / 2 - fw / 2, 0);
  B.box('wood', frame, fw, h, depth + 0.06, -w / 2 - fw / 2 + 0.04, 0, 0);
  B.box('wood', frame, fw, h, depth + 0.06, w / 2 + fw / 2 - 0.04, 0, 0);
  // 桟
  for (let i = 1; i < cols; i++) B.box('wood', frame, 0.035, h, 0.05, -w / 2 + (w * i) / cols, 0, 0);
  for (let i = 1; i < rows; i++) B.box('wood', frame, w, 0.035, 0.05, 0, -h / 2 + (h * i) / rows, 0);
  // ガラス（後でまとめる）
  WIN_GLASS.push({ m: B.top.clone(), w, h });
  // 外の窓台と雪、内の窓台
  if (!opt.noSill) {
    B.box('wood', frame, w + 0.3, 0.06, 0.22, 0, -h / 2 - 0.1, depth / 2 + 0.08);
    B.snow(w + 0.2, 0.2, 0.1, 0, -h / 2 - 0.07, depth / 2 + 0.1);
    B.box('wood', C.shelf, w + 0.2, 0.04, 0.2, 0, -h / 2 - 0.04, -depth / 2 - 0.06);
  }
  if (opt.icicles) icicleRow(-w / 2, w / 2, -h / 2 - 0.13, depth / 2 + 0.16, 0.4);
}
function icicleRow(u0, u1, y, z, maxLen, step = 0.11) {
  for (let u = u0; u < u1; u += step * R(0.6, 1.4)) {
    const L = Math.pow(rnd(), 2.2) * maxLen + 0.03;
    B.add('ice', GEO.cone, [0.75, 0.86, 0.95], u, y - L / 2, z, 0.035 + L * 0.06, L, 0.035 + L * 0.06, PI, 0, 0);
  }
}

// 外壁（下見板）と内壁（腰板＋漆喰）を、穴を避けて張る
// side: 'front'(z1) 'back'(z0) 'west'(x0) 'east'(x1)
function wallSide(bd, side, holes, y0, y1, opt = {}) {
  const t = bd.t;
  let u0, u1, place;
  if (side === 'front' || side === 'back') {
    u0 = bd.x0; u1 = bd.x1;
    const zo = side === 'front' ? bd.z1 : bd.z0, s = side === 'front' ? 1 : -1;
    place = (layer, a, b, ya, yb, color, mat) => {
      const thick = layer === 'out' ? t * 0.5 : t * 0.5;
      const zc = zo - s * (layer === 'out' ? t * 0.25 : t * 0.75);
      B.box(mat, color, b - a, yb - ya, thick, (a + b) / 2, (ya + yb) / 2, zc);
    };
  } else {
    u0 = bd.z0; u1 = bd.z1;
    const xo = side === 'east' ? bd.x1 : bd.x0, s = side === 'east' ? 1 : -1;
    place = (layer, a, b, ya, yb, color, mat) => {
      const xc = xo - s * (layer === 'out' ? t * 0.25 : t * 0.75);
      B.box(mat, color, t * 0.5, yb - ya, b - a, xc, (ya + yb) / 2, (a + b) / 2);
    };
  }
  for (const [a, b, ya, yb] of wallRects(u0, u1, y0, y1, holes)) {
    place('out', a, b, ya, yb, opt.outColor ?? C.siding, opt.outMat ?? 'wood');
    // 内側：腰の高さまで板、上は漆喰
    const wy = (opt.wainscot ?? 1.25) + bd.floor;
    if (ya < wy) place('in', a, b, ya, Math.min(yb, wy), opt.wainColor ?? C.wainscot, 'wood');
    if (yb > wy) place('in', a, b, Math.max(ya, wy), yb, opt.inColor ?? C.plaster, 'plain');
  }
}

function gable(x, s) {

  const yA = MAIN.eave, yR = MAIN.ridgeY + 0.05;

  sh.moveTo(-zB, yA); sh.lineTo(-zA, yA); sh.lineTo(-MAIN.ridgeZ, yR); sh.lineTo(-zB, yA);
  const hole = new THREE.Path(); hole.absarc(-MAIN.ridgeZ, 8.35, 0.62, 0, TAU, true); sh.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(sh, { depth: MAIN.t, bevelEnabled: false, curveSegments: 24 });
  // shape の x→世界 −z、y→y、押し出し→世界 x
  const m = new THREE.Matrix4().makeBasis(new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 1, 0), new THREE.Vector3(1, 0, 0));

// 屋根（赤いトタン）と、その上に厚く積もった雪
function roofPair(bd, len, xCenter, opt = {}) {
  const ov = opt.overhang ?? 0.7, th = opt.thick ?? 0.18;
  for (const s of [1, -1]) {
    const zEdge = s > 0 ? bd.z1 + ov : bd.z0 - ov;
    const run = Math.abs(zEdge - bd.ridgeZ);
    const yEdge = bd.ridgeY - bd.slope * run + 0.1;
    const ang = Math.atan(bd.slope);
    const L = Math.hypot(run, run * bd.slope) + 0.12;
    const zc = (zEdge + bd.ridgeZ) / 2, yc = (yEdge + bd.ridgeY + 0.1) / 2 + th / 2;
    B.at(xCenter, yc, zc, 0, () => {
      B.box(opt.mat ?? 'metal', opt.color ?? C.roof, len, th, L, 0, 0, 0);
      // 鼻隠し
      B.box('wood', opt.fascia ?? C.trim, len + 0.05, 0.28, 0.06, 0, -0.05, s * (L / 2 + 0.02));
      // 雪：厚い板を屋根なりに載せ、軒先でわずかに垂れる
      const sn = opt.snow ?? 0.85;
      B.snow(len + 0.25, L + 0.35, sn, 0, th / 2 - 0.02, s * 0.12);
    }, s > 0 ? ang : -ang);
    // 軒の氷柱
    if (opt.icicles !== false) {
      B.at(xCenter, yEdge - 0.06, zEdge + s * 0.03, 0, () => icicleRow(-len / 2 + 0.1, len / 2 - 0.1, 0, 0, opt.iceLen ?? 0.9, 0.09));
    }
    // 雪庇（軒先から垂れる雪の縁）
    B.at(xCenter, yEdge + 0.25, zEdge + s * 0.12, 0, () => {
      B.snowC(0, 0, 0, len + 0.3, 0.55, 0.55, s * 0.5, 0, 0);
    });
  }
  // 棟の雪
  B.snowC(xCenter, bd.ridgeY + 0.1 + (opt.snow ?? 0.85) * 0.9, bd.ridgeZ, len + 0.3, 0.5, 1.2);
}

const BOOKS = []; // {m: Matrix4, c: Color}
const BOOK_COLS = [0x7a2a24, 0x2c4a6b, 0x3e5b3a, 0x8a6a2e, 0x5a2f4a, 0xc9b38a, 0x2f2f35, 0x6b3b22, 0xa04a2a,
  0x1f3f4f, 0xd8cfb8, 0x4d5a2a, 0x7e7f86, 0x913b3b, 0x2a3f2a, 0xb88a3a, 0x3b4f7a, 0xe0d6c0, 0x5e4630];
function book(x, y, z, w, h, d, rz = 0, ry = 0, color) {
  _e.set(0, ry, rz, 'YXZ');
  const m = B.top.clone().multiply(new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(_e), new THREE.Vector3(w, h, d)));
  BOOKS.push({ m, c: color ? toColor(color) : jitter(pick(BOOK_COLS), 0.08) });
}
// 段 1 つ分を本で埋める。u0..u1 は段の横幅、y は段板の上面、zf は背の位置（局所 +z が手前）
function fillRow(u0, u1, y, maxH, depth, zf, opt = {}) {
  let u = u0 + 0.01;
  const fill = opt.fill ?? 0.93;
  while (u < u1 - 0.03) {
    const r = rnd();
    if (r > fill) { u += R(0.04, 0.25); continue; }
    if (r < 0.04 && maxH > 0.18) {          // 平積み
      let yy = y; const n = RI(2, 5), w = R(0.16, 0.24);
      if (u + w > u1) break;
      for (let i = 0; i < n && yy < y + maxH - 0.05; i++) {
        const t = R(0.025, 0.05); book(u + w / 2 + R(-0.01, 0.01), yy + t / 2, zf - depth / 2 + R(-0.01, 0.01), w, t, depth * R(0.8, 1), 0, R(-0.06, 0.06));
        yy += t;
      }
      u += w + 0.01; continue;
    }
    const big = rnd() < 0.12;
    const w = big ? R(0.04, 0.07) : R(0.018, 0.045);
    const h = Math.min(maxH - 0.015, (big ? R(0.26, 0.34) : R(0.17, 0.27)) * (opt.hScale ?? 1));
    const d = Math.min(depth, R(0.13, 0.22) * (opt.dScale ?? 1));
    if (u + w > u1) break;
    // ときどき傾いた本
    if (rnd() < 0.035 && u > u0 + 0.2) {
      const a = R(0.15, 0.35);
      book(u + Math.sin(a) * h / 2 + w / 2, y + Math.cos(a) * h / 2, zf - d / 2, w, h, d, -a);
      u += Math.sin(a) * h + w + 0.01; continue;
    }
    book(u + w / 2, y + h / 2, zf - d / 2 - R(0, 0.02), w, h, d);
    u += w + R(0, 0.004);
  }
}
// 本棚：局所座標で x が横、+z が手前。double なら背中合わせで両面に本
function bookcase(len, height, depth, levels, opt = {}) {
  const col = opt.color ?? C.shelf, t = 0.035;
  const dbl = !!opt.double;
  B.block('wood', col, t, height, depth, -len / 2 + t / 2, 0, 0);

}

function bareTree(x, z, H) {

    B.tube('wood', 0x3a3028, r, p, q, GEO.cyl6);
    if (depth > 0 && dir.y > 0.2 && r > 0.02) B.tube('snow', SNOW_COL, r * 0.9, p.clone().add(new THREE.Vector3(0, r * 0.9, 0)), q.clone().add(new THREE.Vector3(0, r * 0.9, 0)), GEO.cyl6);

  branch(new THREE.Vector3(x, y, z), new THREE.Vector3(0, 1, 0), H * 0.35, 0.12 + H * 0.01, 4);
}

    this.mUp = mk(`uniform sampler2D tSrc, tAdd; uniform vec2 texel; varying vec2 vUv;
      void main(){ vec2 t = texel;
        vec3 s = texture2D(tSrc, vUv + vec2(-2.0 * t.x, 0.0)).rgb + texture2D(tSrc, vUv + vec2(2.0 * t.x, 0.0)).rgb
               + texture2D(tSrc, vUv + vec2(0.0, 2.0 * t.y)).rgb + texture2D(tSrc, vUv + vec2(0.0, -2.0 * t.y)).rgb
               + (texture2D(tSrc, vUv + vec2(-t.x, t.y)).rgb + texture2D(tSrc, vUv + vec2(t.x, t.y)).rgb
               + texture2D(tSrc, vUv + vec2(t.x, -t.y)).rgb + texture2D(tSrc, vUv + vec2(-t.x, -t.y)).rgb) * 2.0;
        gl_FragColor = vec4(s / 12.0 + texture2D(tAdd, vUv).rgb, 1.0); }`, { tSrc: { value: null }, tAdd: { value: null }, texel: { value: new THREE.Vector2() } });
    this.mFinal = mk(`uniform sampler2D tColor, tBloom; uniform float uBloom, uExposure, uTime, uVig; uniform vec2 uRes; varying vec2 vUv;
      vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
      void main(){
        vec2 dc = vUv - 0.5;

        col.r = texture2D(tColor, vUv - dc * 0.004).r; col.g = texture2D(tColor, vUv).g; col.b = texture2D(tColor, vUv + dc * 0.004).b;
        col += texture2D(tBloom, vUv).rgb * uBloom;
        col *= uExposure;
        float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
        col = mix(col * vec3(0.9, 0.98, 1.14), col * vec3(1.05, 1.0, 0.92), smoothstep(0.02, 0.6, l));
        col = aces(col);

  }
  resize(w, h) {
    for (const r of this.rts) r.dispose();
    this.rts = [];
    const rt = (W, H, o = {}) => { const r = new THREE.WebGLRenderTarget(Math.max(1, W | 0), Math.max(1, H | 0), { type: THREE.HalfFloatType, depthBuffer: false, ...o }); this.rts.push(r); return r; };
    const msaa = Q.get('msaa') === '0' ? 0 : 4;
    this.rScene = rt(w, h, { depthBuffer: true, samples: msaa, depthTexture: new THREE.DepthTexture(w, h) });

  render() {

    this.pass(this.mBokeh, this.rHalfB);

    c.tColor.value = this.rScene.texture; c.tDepth.value = this.rScene.depthTexture; c.tBokeh.value = this.rHalfB.texture;
    this.pass(this.mComp, this.rComp);
    this.mBright.uniforms.tSrc.value = this.rComp.texture; this.mBright.uniforms.texel.value.set(1 / this.w, 1 / this.h);

    for (let i = 1; i < this.down.length; i++) {
      this.mDown.uniforms.tSrc.value = this.down[i - 1].texture;
      this.mDown.uniforms.texel.value.set(1 / this.down[i - 1].width, 1 / this.down[i - 1].height);
      this.pass(this.mDown, this.down[i]);

const post = new Post();

// ============================================================
// 視点
// ============================================================
const VIEWS = [
  { no: '一', name: '全景', text: '雪に降り籠められた町の図書館。道の向こうから、日に数本のバスがやって来る。',
    pos: [28, 21, 35], tgt: [3, 2.4, 0.5], fov: 34, ap: 3.2, fog: 0.011, fogCol: 0x27334b, exp: 1.05, mode: 'orbit', bloom: 0.9 },
  { no: '二', name: '雪の夜道', text: '街灯の下だけ、雪が光って見える。道の先で自販機の明かりがにじむ。',
    pos: [-24, 1.85, 14.4], tgt: [10, 1.7, 13.2], fov: 40, ap: 6, focus: 15, fog: 0.028, fogCol: 0x2a364e, exp: 1.15, mode: 'look', bloom: 1.1 },
  { no: '三', name: '玄関', text: '軒灯の下に雪だるま。縦看板の文字は、先代の館長が書いたもの。',
    pos: [1.7, 1.7, 15.4], tgt: [-0.2, 2.2, 5.5], fov: 42, ap: 5, fog: 0.026, fogCol: 0x2a364e, exp: 1.1, mode: 'look', bloom: 1.0 },
  { no: '四', name: '閲覧室', text: '吹き抜けの閲覧室。壁という壁が本で埋まり、窓の上を蒸気の管が走る。',

  { no: '五', name: 'ストーブ', text: 'だるまストーブの上で、やかんが湯気を上げている。猫はここから動かない。',
    pos: [1.45, 1.3, 1.85], tgt: [-0.1, 1.35, -0.4], fov: 42, ap: 12, fog: 0.01, fogCol: 0x2a2218, exp: 1.0, mode: 'look', bloom: 0.85 },
  { no: '六', name: '二階回廊', text: '回廊の手すり越しに、ストーブを囲む人たちを見下ろす。',
    pos: [-5.0, 5.45, -3.85], tgt: [1.2, 0.9, 1.4], fov: 50, ap: 4, fog: 0.012, fogCol: 0x2a2218, exp: 1.0, mode: 'look', bloom: 0.8 },
  { no: '七', name: '書庫', text: '土蔵を改めた書庫。郷土の古い記録が、裸電球の下で眠っている。',
    pos: [11.7, 1.65, -1.75], tgt: [17.3, 1.5, -1.75], fov: 52, ap: 4, fog: 0.035, fogCol: 0x1e1812, exp: 1.05, mode: 'look', bloom: 0.9 },
];
const nav = document.getElementById('views');
VIEWS.forEach((v, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.innerHTML = `<span>${v.no}</span>${v.name}`;
  b.addEventListener('click', () => { stopTour(); go(i); });
  nav.appendChild(b);
});
let cur = START_VIEW, yaw = 0, pitch = 0, zoom = 1, viewT0 = 0;
const fade = document.getElementById('fade');
const camState = { pos: new THREE.Vector3(), tgt: new THREE.Vector3() };
function applyView(i) {
  cur = i; yaw = 0; pitch = 0; zoom = 1;
  const v = VIEWS[i];
  camState.pos.set(...v.pos); camState.tgt.set(...v.tgt);
  scene.fog.density = v.fog; scene.fog.color.set(v.fogCol);
  post.mFinal.uniforms.uExposure.value = v.exp;

  document.getElementById('capName').textContent = v.name;
  document.getElementById('capText').textContent = v.text;

}
let switching = false;
function go(i) {
  if (i === cur || switching) return;
  switching = true;
  fade.style.opacity = 1;
  setTimeout(() => { applyView(i); viewT0 = clock.getElapsedTime(); fade.style.opacity = 0; switching = false; }, 520);
}
// 巡回
const tourBtn = document.getElementById('tour');
let tourTimer = null;
function stopTour() { if (tourTimer) clearInterval(tourTimer); tourTimer = null; tourBtn.setAttribute('aria-pressed', 'false'); }
tourBtn.addEventListener('click', () => {
  if (tourTimer) return stopTour();
  tourBtn.setAttribute('aria-pressed', 'true');
  go((cur + 1) % VIEWS.length);
  tourTimer = setInterval(() => go((cur + 1) % VIEWS.length), 16000);
});
addEventListener('keydown', (e) => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= VIEWS.length) { stopTour(); go(n - 1); }
});
// ドラッグで見回す（屋外の全景は回り込む）、ホイール・ピンチで寄る
{
  let drag = null; const pts = new Map(); let pinch0 = 0, zoom0 = 1;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 1) drag = { x: e.clientX, y: e.clientY, yaw, pitch };
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); zoom0 = zoom; drag = null; }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) { const [a, b] = [...pts.values()]; zoom = clamp(zoom0 * pinch0 / Math.max(1, Math.hypot(a[0] - b[0], a[1] - b[1])), 0.6, 1.35); return; }
    if (!drag) return;
    const v = VIEWS[cur], k = v.mode === 'orbit' ? 0.006 : 0.004;
    yaw = clamp(drag.yaw - (e.clientX - drag.x) * k, v.mode === 'orbit' ? -1.3 : -0.7, v.mode === 'orbit' ? 1.3 : 0.7);
    pitch = clamp(drag.pitch + (e.clientY - drag.y) * k, -0.35, 0.3);
  });
  const up = (e) => { pts.delete(e.pointerId); if (pts.size === 0) drag = null; };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoom = clamp(zoom * (1 + e.deltaY * 0.001), 0.6, 1.35); }, { passive: false });
}

// ============================================================
// 時計の表示（漢数字）
// ============================================================
const KAN = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
function kanNum(n) {
  if (n === 0) return '〇';
  let s = '';
  const t = Math.floor(n / 10), o = n % 10;
  if (t > 0) s += (t > 1 ? KAN[t] : '') + '十';
  if (o > 0) s += KAN[o];
  return s;
}
const clockEl = document.getElementById('clock');
let lastMin = -1;
function updateClockText(sec) {
  const total = Math.floor(17 * 60 + 12 + sec / 60), h = Math.floor(total / 60) % 24, m = total % 60;
  if (m === lastMin) return; lastMin = m;
  const hh = h % 12 || 12;
  clockEl.textContent = `${h < 12 ? '午前' : '午後'}${kanNum(hh)}時${m === 0 ? '' : kanNum(m) + '分'}`;
}

// ============================================================
// 動かす
// ============================================================
const T_START = performance.now();
const clock = { getElapsedTime: () => (performance.now() - T_START) / 1000 };
const look = new THREE.Vector3(), fwd = new THREE.Vector3(), tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const db = renderer.getDrawingBufferSize(new THREE.Vector2());
  post.resize(db.x, db.y);
}
addEventListener('resize', resize);
resize();
applyView(START_VIEW);

function camZoneOf(p) {
  for (let k = 0; k < 3; k++) {
    const a = ZU.uZMin.value[k], b = ZU.uZMax.value[k], r = ZU.uZRoof.value[k];
    if (p.x > a.x && p.y > a.y && p.z > a.z && p.x < b.x && p.y < b.y && p.z < b.z && p.y < r.x - r.z * Math.abs(p.z - r.y)) return r.w;
  }
  return 0;
}

const state = { frames: 0, ready: false };
window.__lib = state;
function frame() {
  const T = FIXED_T !== null ? FIXED_T : clock.getElapsedTime();
  ZU.uTime.value = T;
  const v = VIEWS[cur];

  // --- カメラ ---
  const tv = T - (FIXED_T !== null ? 0 : viewT0);
  const zf = zoom;
  if (v.mode === 'orbit') {
    tmp.subVectors(camState.pos, camState.tgt);
    const r = tmp.length() * zf;
    let az = Math.atan2(tmp.x, tmp.z) + yaw + Math.sin(T * 0.035) * 0.16;
    let el = Math.asin(tmp.y / tmp.length()) + pitch;
    el = clamp(el, 0.12, 1.25);
    camera.position.set(camState.tgt.x + r * Math.cos(el) * Math.sin(az), camState.tgt.y + r * Math.sin(el), camState.tgt.z + r * Math.cos(el) * Math.cos(az));
    camera.lookAt(camState.tgt);
    camera.fov = v.fov;
  } else {
    camera.position.copy(camState.pos);
    camera.position.x += Math.sin(T * 0.21) * 0.05; camera.position.y += Math.sin(T * 0.17 + 1) * 0.03;
    fwd.subVectors(camState.tgt, camState.pos);
    const dist = fwd.length(); fwd.normalize();
    const az = Math.atan2(fwd.x, fwd.z) + yaw + Math.sin(T * 0.05) * 0.03;
    const el = Math.asin(fwd.y) + pitch;
    look.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)).multiplyScalar(dist).add(camera.position);
    camera.lookAt(look);
    camera.fov = v.fov * zf;
  }

  const focusDist = v.focus ?? camera.position.distanceTo(v.mode === 'orbit' ? camState.tgt : look);
  post.cocU.uFocus.value = focusDist;
  post.cocU.uAperture.value = v.ap;
  const camZone = camZoneOf(camera.position);
  CAM_ZONE.value = camZone;
  const db = post.h;
  snowU.uPx.value = db / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  snowU.uCam.value.copy(camera.position);
  snowU.uFocus.value = focusDist;
  snowU.uAperture.value = v.ap * 2;
  snowU.uFogD.value = scene.fog.density;
  snowNear.visible = camZone === 0;
  haloMesh.material.uniforms.uFogD.value = scene.fog.density;

  // --- 灯りのゆらぎ ---
  const fl = 0.78 + 0.14 * Math.sin(T * 9.1) + 0.08 * Math.sin(T * 23.7 + 1.3) + 0.06 * Math.sin(T * 3.3);
  stoveLight.intensity = stoveLight.userData.base * fl;
  stoveFire.material.color.setRGB(6 * fl, 2.4 * fl, 0.6 * fl);
  for (const kb of KBULBS) {
    const sw = Math.sin(T * 0.9 + kb.seed) * 0.05;
    kb.g.rotation.z = sw; kb.g.rotation.x = Math.sin(T * 0.7 + kb.seed) * 0.03;
    const px = kb.x + Math.sin(sw) * (kb.len + 0.1), py = kb.top - Math.cos(sw) * (kb.len + 0.1);
    kb.l.position.set(px, py, -1.75 + Math.sin(kb.g.rotation.x) * kb.len);
  }

  // --- 時計 ---
  const sec = 17 * 3600 + 12 * 60 + T;
  clockParts.minHand.rotation.z = -((sec / 3600) % 1) * TAU;
  clockParts.hourHand.rotation.z = -((sec / 43200) % 1) * TAU;
  clockParts.pend.rotation.z = Math.sin(T * PI) * 0.12;
  updateClockText(T);

  // --- 人 ---
  for (const w of WALKERS) w.update(T);
  for (const s of SEATED) s.fn(s.p, T);
  {
    const L = BASE.x1 - BASE.x0 + 8, x = BASE.x0 - 4 + ((T * 1.05 + 30) % L);
    roadWalker.root.position.set(x, groundH(x, 16.3) - 0.03, 16.3);
    roadWalker.root.rotation.y = PI / 2;
    poseWalk(roadWalker, x * 4.2, 1);
  }
  {
    const c = (T * 0.5) % 1, k = Math.sin(c * TAU);
    shoveler.body.rotation.x = 0.35 + 0.25 * Math.max(0, k);
    shoveler.arms[0].rotation.x = shoveler.arms[1].rotation.x = -0.7 - 0.35 * Math.max(0, -k);
    shoveler.body.rotation.y = 0.25 * Math.max(0, -k);
    shoveler.legs[0].hip.rotation.x = -0.25; shoveler.legs[0].knee.rotation.x = 0.35;
    shoveler.legs[1].hip.rotation.x = 0.15;

  // --- バス ---
  const bs = busState(T);

  bus.visible = bs.on;
  busLight.intensity = bs.on ? 60 : 0;
  for (const bm of busBeams) bm.material.uniforms.uOn.value = bs.on ? 1 : 0;
  const hx = bs.x + 3.65, inBase = (x) => (x > BASE.x0 && x < BASE.x1 ? 1 : 0);
  busHaloL.position.set(hx, 0.77, 13.4 - 0.82); busHaloR.position.set(hx, 0.77, 13.4 + 0.82);
  busHaloL.visible = busHaloR.visible = bs.on && inBase(hx);
  busTail[0].position.set(bs.x - 3.65, 0.9, 13.4 - 0.95); busTail[1].position.set(bs.x - 3.65, 0.9, 13.4 + 0.95);

  }
  requestAnimationFrame(frame);
}
