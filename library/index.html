<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>雪籠りの図書館</title>
<meta name="description" content="雪に降り籠められた山あいの町の小さな図書館。three.js で、建物も本も人もすべてコードで作った箱庭。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
  /* 夜の箱庭を窓から覗く。文字は雪明かりの色、差し色はストーブと街灯の橙だけ */
  :root {
    --ink: #0a0f18;
    --veil: rgba(9, 13, 21, 0.62);
    --snow: #e7ecf3;
    --frost: #98aac3;
    --lamp: #f2b562;
    --lamp-soft: rgba(242, 181, 98, 0.16);
    --line: rgba(231, 236, 243, 0.16);
    --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--snow); overflow: hidden; }
  body { font-family: var(--body); -webkit-font-smoothing: antialiased; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#gl:active { cursor: grabbing; }
  #fade { position: fixed; inset: 0; background: var(--ink); opacity: 1; pointer-events: none; transition: opacity 0.6s ease; }

  .title {
    position: fixed; top: calc(20px + env(safe-area-inset-top, 0px)); right: 22px;
    display: flex; flex-direction: row-reverse; gap: 10px; align-items: flex-start;
    pointer-events: none; text-shadow: 0 0 18px rgba(0, 0, 0, 0.6);
  }
  .title h1 {
    writing-mode: vertical-rl; margin: 0; font-family: var(--display); font-weight: 700;
    font-size: clamp(24px, 3.4vw, 40px); letter-spacing: 0.32em; line-height: 1;
  }
  .title p {
    writing-mode: vertical-rl; margin: 0.4em 0 0; font-family: var(--display); font-weight: 500;
    font-size: 13px; letter-spacing: 0.3em; color: var(--frost);
  }
  .meta {
    position: fixed; top: calc(20px + env(safe-area-inset-top, 0px)); left: 20px;
    font-size: 12px; letter-spacing: 0.12em; color: var(--frost);
    display: flex; flex-direction: column; gap: 4px; pointer-events: none;
    font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
  }
  .meta b { font-weight: 500; color: var(--snow); }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 20px calc(18px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    pointer-events: none;
    background: linear-gradient(to top, rgba(6, 9, 15, 0.7), rgba(6, 9, 15, 0));
    padding-top: 60px;
  }
  .caption { display: flex; gap: 14px; align-items: flex-start; min-width: 0; max-width: 34em; text-shadow: 0 0 14px rgba(0, 0, 0, 0.8); }
  .caption .no { font-family: var(--display); font-size: 15px; color: var(--lamp); padding-top: 9px; }
  .caption h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(22px, 2.6vw, 30px); letter-spacing: 0.24em; }
  .caption p { margin: 4px 0 0; font-size: 13px; line-height: 1.7; color: var(--frost); letter-spacing: 0.04em; }

  .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: auto; min-width: 0; }
  nav#views { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
  nav#views button, #tour, #sound, #follow, #full {
    font: inherit; font-size: 13px; letter-spacing: 0.1em; color: var(--snow);
    background: var(--veil); border: 1px solid var(--line); border-radius: 2px;
    padding: 7px 11px 6px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: border-color 0.2s, background 0.2s, color 0.2s;
  }
  nav#views button span { font-family: var(--display); color: var(--frost); margin-right: 0.45em; }
  nav#views button:hover, #tour:hover, #sound:hover, #follow:hover, #full:hover { border-color: rgba(242, 181, 98, 0.55); }
  nav#views button[aria-current="true"] { border-color: var(--lamp); background: var(--lamp-soft); }
  nav#views button[aria-current="true"] span { color: var(--lamp); }
  button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
  .row2 { display: flex; gap: 10px; align-items: center; }
  #tour[aria-pressed="true"], #sound[aria-pressed="true"], #follow[aria-pressed="true"] { border-color: var(--lamp); color: var(--lamp); }
  .hint { font-size: 11px; color: var(--frost); letter-spacing: 0.08em; opacity: 0.8; }

  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    font-family: var(--display); letter-spacing: 0.4em; color: var(--frost); font-size: 15px;
    transition: opacity 0.8s ease;
  }
  body.hide-ui .title, body.hide-ui .meta, body.hide-ui .bottom { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .cap-ch { opacity: 0; animation: chIn 0.7s ease forwards; }
  @keyframes chIn { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: blur(0); } }

  @media (max-width: 720px) {
    .title { right: 16px; }
    .title h1 { font-size: 24px; }
    .title p { font-size: 11px; }
    .meta { left: 16px; font-size: 11px; }
    .bottom { padding-left: 16px; padding-right: 16px; flex-direction: column; align-items: stretch; }
    .controls { align-items: stretch; }
    nav#views { justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
    nav#views::-webkit-scrollbar { display: none; }
    nav#views button { flex: none; }
    .row2 { justify-content: flex-start; flex-wrap: wrap; }
    nav#views button { padding: 6px 8px 5px; font-size: 12px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #fade { transition: none; } .cap-ch { animation: none; opacity: 1; } }
</style>

<body>
<canvas id="gl" aria-label="雪に埋もれた図書館の箱庭"></canvas>
<div id="fade"></div>
<div id="loading">雪を降らせています</div>

<header class="title">
  <h1>雪籠りの図書館</h1>
  <p>雪野町立図書館　冬季開館中</p>
</header>

<div class="meta" aria-live="off">
  <span id="clock">午後五時十二分</span>
  <span>外気 <b id="temp">−7.0℃</b>　積雪 <b id="depth">148cm</b></span>
</div>

<div class="bottom">
  <section class="caption" aria-live="polite">
    <span class="no" id="capNo">一</span>
    <div>
      <h2 id="capName">全景</h2>
      <p id="capText" aria-hidden="true"></p>
      <span class="sr" id="capSR"></span>
    </div>

  <div class="controls">
    <nav id="views" aria-label="視点の切り替え"></nav>

      <span class="hint">ドラッグで見回す　1〜7 で切り替え　M 音　H 文字を隠す</span>
      <button id="follow" type="button" aria-pressed="false">ついて歩く</button>
      <button id="sound" type="button" aria-pressed="false" aria-label="音を出す">音</button>
      <button id="tour" type="button" aria-pressed="false">巡回</button>
      <button id="full" type="button" hidden>全画面</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   雪籠りの図書館
   画像も 3D モデルも使わない。建物・本・人・雪・光はすべてここで作る。
   URL の引数：view=1..7（最初の視点） t=秒（時刻を止める。撮影用） ui=0（文字を隠す）
   ============================================================ */

const Q = new URLSearchParams(location.search);
const FIXED_T = Q.has('t') ? parseFloat(Q.get('t')) : null;
const START_VIEW = Math.min(6, Math.max(0, (parseInt(Q.get('view') || '1', 10) || 1) - 1));
if (Q.get('ui') === '0') document.body.classList.add('hide-ui');
// q=low で、霧の中の光と隅の暗さ（重い処理）を切る
const QUALITY = Q.get('q') === 'low' ? 0 : 1;

// ---------- 乱数と雑音（毎回同じ箱庭になるよう種を固定） ----------
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// 乱数は区画ごとに種を分ける（どこかに呼び出しを足しても、ほかの区画の配置がずれない）
let rngCur = mulberry(20261207);
const rnd = () => rngCur();
function useRng(seed) { rngCur = mulberry(seed); }
const R = (a = 0, b = 1) => a + (b - a) * rnd();
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  const ab = a + (b - a) * u, cd = c + (d - c) * u;
  return ab + (cd - ab) * v;
}
function fbm(x, y, o = 4) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < o; i++) { s += a * (vnoise(x * f, y * f) * 2 - 1); f *= 2.03; a *= 0.5; }
  return s;
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const PI = Math.PI, TAU = Math.PI * 2;
const SNOW_COL_EARLY = [0.86, 0.9, 0.97];

// ---------- 画面 ----------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0x27334b);
scene.fog = new THREE.FogExp2(FOG_COLOR.clone(), 0.02);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.08, 420);

// ---------- 建物の寸法（外壁の外面） ----------
// 本館：土間・カウンター・閲覧室がひと続きの部屋。棟は東西で、軒を道（南）へ向ける
const MAIN = { x0: -1, x1: 5.9, z0: -4.6, z1: 4, t: 0.18, floor: 0.5, eave: 3.55, ceil: 3.4, ridgeZ: -0.3, slope: 0.75 };
MAIN.ridgeY = MAIN.eave + (MAIN.z1 - MAIN.ridgeZ) * MAIN.slope;
// 西の棟：東西の廊下の北に、便所・宿直室・炊事場
const WING = { x0: -8, x1: -1, z0: -2.5, z1: 1.2, t: 0.18, floor: 0.5, eave: 3.05, ceil: 2.95, ridgeZ: -0.65, slope: 0.85 };
WING.ridgeY = WING.eave + (WING.z1 - WING.ridgeZ) * WING.slope;
// 書庫：閲覧室の南に張り出したコンクリートの箱（東の壁は本館と一直線）。北の壁は本館の表の壁の内側から
const STACK = { x0: 3.7, x1: 5.9, z0: 4 - 0.18, z1: 7.4, t: 0.22, floor: 0.2, ceil: 2.6, top: 2.8 };

/* ---------- 屋内と屋外の光を分ける ----------
   壁に影を落とさない安い灯りは壁を素通りする。そこで描くときに「この点はどの部屋か」を調べ、
   灯りごとに決めた部屋の中だけを照らす。月明かりと空の光は屋内では弱める。 */
const MAXL = 24;
const ZU = {
  // 1 本館、2 書庫、3 西の棟。どれも天井が平らなので、屋根の勾配での切り落としは使わない
  uZMin: { value: [
    new THREE.Vector3(MAIN.x0 + 0.1, -1, MAIN.z0 + 0.1),
    new THREE.Vector3(STACK.x0 + 0.1, -1, STACK.z0 + 0.12),
    new THREE.Vector3(WING.x0 + 0.1, -1, WING.z0 + 0.1) ] },
  uZMax: { value: [
    new THREE.Vector3(MAIN.x1 - 0.1, MAIN.ceil + 0.06, MAIN.z1 - 0.1),
    new THREE.Vector3(STACK.x1 - 0.1, STACK.ceil + 0.06, STACK.z1 - 0.1),
    new THREE.Vector3(WING.x1 + 0.05, WING.ceil + 0.06, WING.z1 - 0.1) ] },
  uZRoof: { value: [
    new THREE.Vector4(1e3, 0, 0, 1),
    new THREE.Vector4(1e3, 0, 0, 2),
    new THREE.Vector4(1e3, 0, 0, 3) ] },
  uLZ: { value: new Float32Array(MAXL).fill(-1) },
  uIndoorSky: { value: 0.22 },
  uTime: { value: 0 },
};
const ZONE_GLSL = /* glsl */ `
  uniform vec3 uZMin[3]; uniform vec3 uZMax[3]; uniform vec4 uZRoof[3];
  uniform float uLZ[${MAXL}];
  uniform float uIndoorSky;
  uniform float uTime;
  varying vec3 vWPos;
  varying vec3 vWNrm;
  float zId;
  float zoneOf(vec3 p) {
    for (int k = 0; k < 3; k++) {
      if (all(greaterThan(p, uZMin[k])) && all(lessThan(p, uZMax[k])) &&
          p.y < uZRoof[k].x - uZRoof[k].z * abs(p.z - uZRoof[k].y)) return uZRoof[k].w;
    }
    return 0.0;
  }
  float lzMask(float lz) { return (lz < -0.5 || abs(lz - zId) < 0.5) ? 1.0 : 0.0; }
`;
const LIGHTS_CHUNK = THREE.ShaderChunk.lights_fragment_begin
  .replace('getPointLightInfo( pointLight, geometryPosition, directLight );',
    'getPointLightInfo( pointLight, geometryPosition, directLight ); directLight.color *= lzMask( uLZ[ i ] );')
  .replace('getSpotLightInfo( spotLight, geometryPosition, directLight );',
    'getSpotLightInfo( spotLight, geometryPosition, directLight ); directLight.color *= ( zId < 0.5 ? 1.0 : 0.0 );')
  .replace('getDirectionalLightInfo( directionalLight, directLight );',
    'getDirectionalLightInfo( directionalLight, directLight ); directLight.color *= ( zId < 0.5 ? 1.0 : 0.0 );')
  .replace('irradiance += getHemisphereLightIrradiance( hemisphereLights[ i ], geometryNormal );',
    'irradiance += getHemisphereLightIrradiance( hemisphereLights[ i ], geometryNormal ) * ( zId < 0.5 ? 1.0 : uIndoorSky );');

// 標準の材質に「部屋分け」「世界座標の模様（三方向から貼る）」「雪のきらめき」を差し込む
function patch(mat, opt = {}) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, ZU);
    if (opt.tri) {
      sh.uniforms.tTri = { value: opt.tri };
      sh.uniforms.uTriScale = { value: opt.triScale || 0.5 };
      sh.uniforms.uTriAmt = { value: opt.triAmt ?? 1 };
    }
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\nvarying vec3 vWNrm;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 zwp = vec4( transformed, 1.0 );
        vec3 zwn = objectNormal;
        #ifdef USE_INSTANCING
          zwp = instanceMatrix * zwp; zwn = mat3( instanceMatrix ) * zwn;
        #endif
        vWPos = ( modelMatrix * zwp ).xyz;
        vWNrm = normalize( mat3( modelMatrix ) * zwn );`);
    let fs = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + ZONE_GLSL +
        (opt.tri ? `
        uniform sampler2D tTri; uniform float uTriScale; uniform float uTriAmt;
        float triTex(vec3 p, vec3 n) {
          vec3 w = pow(abs(n), vec3(4.0)); w /= (w.x + w.y + w.z);
          float a = texture2D(tTri, p.zy * uTriScale).r;
          float b = texture2D(tTri, p.xz * uTriScale).r;
          float c = texture2D(tTri, p.xy * uTriScale).r;
          return a * w.x + b * w.y + c * w.z;
        }` : ''))
      .replace('void main() {', 'void main() {\n zId = zoneOf( vWPos );')
      .replace('#include <lights_fragment_begin>', LIGHTS_CHUNK);
    if (opt.tri) {
      fs = fs.replace('#include <color_fragment>', `#include <color_fragment>
        diffuseColor.rgb *= mix( 1.0, triTex( vWPos, normalize( vWNrm ) ) * 1.25, uTriAmt );`);
    }
    if (opt.weather) {
      Object.assign(sh.uniforms, WU);
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', '#include <common>\nattribute float aGrime;\nvarying float vGrime;')
        .replace('#include <project_vertex>', '#include <project_vertex>\n vGrime = aGrime;');
      fs = fs.replace('#include <common>', `#include <common>
        varying float vGrime;
        uniform sampler2D tNoise; uniform vec4 uShelter[${SHELTERS.length}]; uniform float uShelterY[${SHELTERS.length}];
        uniform float uSnowCover; uniform vec3 uSnowCol;
        float sheltered(vec3 p) {
          for (int k = 0; k < ${SHELTERS.length}; k++) {
            vec4 b = uShelter[k];
            if (p.x > b.x && p.x < b.z && p.z > b.y && p.z < b.w && p.y < uShelterY[k]) return 1.0;
          }
          return 0.0;
        }`)
        .replace('#include <color_fragment>', `#include <color_fragment>
        if ( zId < 0.5 ) {
          vec3 wn = normalize( vWNrm );
          // 年季：大きなしみ、上から垂れた筋、足もとの濡れ色（汚れの量は頂点が持つ）
          if ( vGrime > 0.0 ) {
            float side = 1.0 - abs( wn.y );
            float big = texture2D( tNoise, ( vWPos.xz + vWPos.yy * 0.7 ) * 0.035 ).r;
            float streak = texture2D( tNoise, vec2( ( vWPos.x + vWPos.z ) * 0.9, vWPos.y * 0.035 ) ).g;
            diffuseColor.rgb *= mix( 1.0, ( 0.68 + 0.55 * big ) * mix( 1.0, 0.72 + 0.45 * streak, side ), vGrime );
            float damp = 1.0 - smoothstep( 0.35, 0.95, vWPos.y );
            diffuseColor.rgb *= mix( 1.0, 0.7, damp * side * min( 1.0, vGrime * 2.5 ) );
          }
          // 上を向いた面には、屋根の下でなければ雪が載る（まだらに）
          float up = smoothstep( 0.5, 0.85, wn.y ) * ( 1.0 - sheltered( vWPos ) );
          float patchy = texture2D( tNoise, vWPos.xz * 0.6 ).b;
          float cover = up * smoothstep( 0.25, 0.55, patchy + 0.25 ) * uSnowCover;
          diffuseColor.rgb = mix( diffuseColor.rgb, uSnowCol, cover );
        }`);
    }
    if (opt.ice) {
      // 除雪された道の轍と、踏み固めた玄関の道は凍って艶が出る。街灯とバスの灯りが縦に伸びて映る
      sh.uniforms.uSkyRefl = { value: new THREE.Color(0x3a4a66) };
      fs = fs.replace('#include <common>', '#include <common>\nuniform vec3 uSkyRefl; float gIce = 0.0;')
        .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
          {
            float road = smoothstep(12.0, 12.7, vWPos.z) * (1.0 - smoothstep(16.3, 17.0, vWPos.z));
            float rut = exp(-pow(vWPos.z - 13.5, 2.0) / 0.15) + exp(-pow(vWPos.z - 15.4, 2.0) / 0.15);
            float path = (1.0 - smoothstep(0.7, 1.3, abs(vWPos.x))) * smoothstep(4.4, 5.0, vWPos.z) * (1.0 - smoothstep(11.4, 12.2, vWPos.z));
            float nz = fract(sin(dot(floor(vWPos.xz * vec2(0.8, 3.0)), vec2(12.9898, 78.233))) * 43758.5453);
            gIce = clamp(road * (0.3 + 0.7 * min(rut, 1.0)) + path * 0.45, 0.0, 1.0) * (0.55 + 0.45 * nz);
            roughnessFactor = mix(roughnessFactor, 0.1, gIce);
            diffuseColor.rgb *= mix(1.0, 0.55, gIce);
          }`)
        .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
          normal = normalize(normal + (viewMatrix * vec4(sin(vWPos.x * 9.0 + vWPos.z * 2.0) * 0.05, 0.0, sin(vWPos.x * 2.3 + 1.0) * 0.08, 0.0)).xyz * gIce);`)
        .replace('#include <opaque_fragment>', `outgoingLight += uSkyRefl * pow(1.0 - saturate(dot(normal, geometryViewDir)), 4.0) * gIce * 0.35;
          #include <opaque_fragment>`);
    }
    if (opt.sparkle) {
      fs = fs.replace('#include <opaque_fragment>', `
        {

      nor[(vo + i) * 3] = v.x; nor[(vo + i) * 3 + 1] = v.y; nor[(vo + i) * 3 + 2] = v.z;
      if (U) { uv[(vo + i) * 2] = U.getX(i); uv[(vo + i) * 2 + 1] = U.getY(i); }
      col[(vo + i) * 3] = it.color.r; col[(vo + i) * 3 + 1] = it.color.g; col[(vo + i) * 3 + 2] = it.color.b;
      gr[vo + i] = it.grime || 0;

// 壁：窓や戸の穴を避けて、残りを箱で埋める。u は壁に沿う向き、穴は [u0,u1,y0,y1]
function wallRects(u0, u1, y0, y1, holes) {
  const us = new Set([u0, u1]);
  for (const h of holes) { us.add(clamp(h[0], u0, u1)); us.add(clamp(h[1], u0, u1)); }
  const xs = [...us].sort((a, b) => a - b), out = [];
  for (let i = 0; i < xs.length - 1; i++) {
    const a = xs[i], b = xs[i + 1];
    if (b - a < 1e-4) continue;
    const mid = (a + b) / 2;
    const hs = holes.filter((h) => h[0] < mid && h[1] > mid).map((h) => [h[2], h[3]]).sort((p, q) => p[0] - q[0]);
    let y = y0;
    for (const [ha, hb] of hs) { if (ha > y) out.push([a, b, y, ha]); y = Math.max(y, hb); }
    if (y < y1) out.push([a, b, y, y1]);
  }
  return out;
}

function wallSide(bd, side, holes, y0, y1, opt = {}) {
  const t = bd.t;
  let u0, u1, place;
  if (side === 'front' || side === 'back') {
    u0 = opt.u0 ?? bd.x0; u1 = opt.u1 ?? bd.x1;
    const zo = side === 'front' ? bd.z1 : bd.z0, s = side === 'front' ? 1 : -1;
    place = (layer, a, b, ya, yb, color, mat) => {
      const zc = zo - s * (layer === 'out' ? t * 0.25 : t * 0.75);
      B.box(mat, color, b - a, yb - ya, t * 0.5, (a + b) / 2, (ya + yb) / 2, zc);
    };
  } else {
    u0 = opt.u0 ?? bd.z0; u1 = opt.u1 ?? bd.z1;
    const xo = side === 'east' ? bd.x1 : bd.x0, s = side === 'east' ? 1 : -1;
    place = (layer, a, b, ya, yb, color, mat) => {
      const xc = xo - s * (layer === 'out' ? t * 0.25 : t * 0.75);
      B.box(mat, color, t * 0.5, yb - ya, b - a, xc, (ya + yb) / 2, (a + b) / 2);
    };
  }
  for (const [a, b, ya, yb] of wallRects(u0, u1, y0, y1, holes)) {
    B.withGrime(opt.grime ?? 0.3, () => place('out', a, b, ya, yb, opt.outColor ?? C.siding, opt.outMat ?? 'wood'));
    if (opt.noIn) continue;
    // 内側：腰の高さまで板、上は漆喰
    const wy = (opt.wainscot ?? 1.25) + bd.floor;
    if (ya < wy) place('in', a, b, ya, Math.min(yb, wy), opt.wainColor ?? C.wainscot, 'wood');
    if (yb > wy) place('in', a, b, Math.max(ya, wy), yb, opt.inColor ?? C.plaster, 'plain');
  }
}

const BOOKS = []; // {m: Matrix4, c: Color}
const BOOK_COLS = [0x7a2a24, 0x2c4a6b, 0x3e5b3a, 0x8a6a2e, 0x5a2f4a, 0xc9b38a, 0x2f2f35, 0x6b3b22, 0xa04a2a,
  0x1f3f4f, 0xd8cfb8, 0x4d5a2a, 0x7e7f86, 0x913b3b, 0x2a3f2a, 0xb88a3a, 0x3b4f7a, 0xe0d6c0, 0x5e4630];
function book(x, y, z, w, h, d, rz = 0, ry = 0, color) {
  _e.set(0, ry, rz, 'YXZ');
  const m = B.top.clone().multiply(new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(_e), new THREE.Vector3(w, h, d)));
  BOOKS.push({ m, c: color ? toColor(color) : jitter(pick(BOOK_COLS), 0.08) });
}
// 段 1 つ分を本で埋める。u0..u1 は段の横幅、y は段板の上面、zf は背の位置（局所 +z が手前）
function fillRow(u0, u1, y, maxH, depth, zf, opt = {}) {
  let u = u0 + 0.01;
  const fill = opt.fill ?? 0.93;
  while (u < u1 - 0.03) {
    const r = rnd();
    if (r > fill) { u += R(0.04, 0.25); continue; }
    if (r < 0.04 && maxH > 0.18) {          // 平積み
      let yy = y; const n = RI(2, 5), w = R(0.16, 0.24);
      if (u + w > u1) break;
      for (let i = 0; i < n && yy < y + maxH - 0.05; i++) {
        const t = R(0.025, 0.05); book(u + w / 2 + R(-0.01, 0.01), yy + t / 2, zf - depth / 2 + R(-0.01, 0.01), w, t, depth * R(0.8, 1), 0, R(-0.06, 0.06));
        yy += t;
      }
      u += w + 0.01; continue;
    }
    const big = rnd() < 0.12;
    const w = big ? R(0.04, 0.07) : R(0.018, 0.045);
    const h = Math.min(maxH - 0.015, (big ? R(0.26, 0.34) : R(0.17, 0.27)) * (opt.hScale ?? 1));
    const d = Math.min(depth, R(0.13, 0.22) * (opt.dScale ?? 1));
    if (u + w > u1) break;
    // ときどき傾いた本
    if (rnd() < 0.035 && u > u0 + 0.2) {
      const a = R(0.15, 0.35);
      book(u + Math.sin(a) * h / 2 + w / 2, y + Math.cos(a) * h / 2, zf - d / 2, w, h, d, -a);
      u += Math.sin(a) * h + w + 0.01; continue;
    }
    book(u + w / 2, y + h / 2, zf - d / 2 - R(0, 0.02), w, h, d);
    u += w + R(0, 0.004);
  }
}
// 本棚：局所座標で x が横、+z が手前。double なら背中合わせで両面に本
function bookcase(len, height, depth, levels, opt = {}) {
  const col = opt.color ?? C.shelf, t = 0.035, mat = opt.mat ?? 'wood', dark = opt.mat ? col : C.shelfDark;
  const dbl = !!opt.double;
  B.block(mat, col, t, height, depth, -len / 2 + t / 2, 0, 0);
  B.block(mat, col, t, height, depth, len / 2 - t / 2, 0, 0);
  B.block(mat, col, len + 0.04, 0.04, depth + 0.04, 0, height, 0);           // 天板
  B.block(mat, dark, len, 0.09, depth, 0, 0, 0);                             // 台輪
  if (!dbl) B.box(mat, dark, len, height, 0.015, 0, height / 2, -depth / 2 + 0.008); // 背板
  else B.box(mat, dark, len, height, 0.015, 0, height / 2, 0);
  // 長い棚は途中に仕切り
  const bays = Math.max(1, Math.round(len / 0.9));
  for (let i = 1; i < bays; i++) B.block(mat, col, 0.025, height, depth, -len / 2 + (len * i) / bays, 0, 0);
  const lh = (height - 0.13) / levels;
  for (let k = 0; k < levels; k++) {
    const y = 0.09 + k * lh;
    if (k > 0) B.box(mat, col, len - 0.05, 0.025, depth, 0, y, 0);
    if (opt.noBooks) continue;
    for (let i = 0; i < bays; i++) {
      const a = -len / 2 + (len * i) / bays + 0.025, b = -len / 2 + (len * (i + 1)) / bays - 0.02;
      if (opt.item && rnd() < opt.item) { opt.itemFn(a, b, y + 0.012, lh, depth); continue; }
      fillRow(a, b, y + 0.012, lh - 0.04, dbl ? depth / 2 - 0.02 : depth - 0.03, depth / 2, opt);
      if (dbl) B.at(0, 0, 0, PI, () => fillRow(-b, -a, y + 0.012, lh - 0.04, depth / 2 - 0.02, depth / 2, opt));
    }
  }
  if (opt.noBooks) return;
  // 天板の上：区画ごとに、何か 1 つ置くかどうかを抽選
  if (opt.top !== false) {
    for (let i = 0; i < bays; i++) {
      if (rnd() > 0.45) continue;
      const cx = -len / 2 + (len * (i + 0.5)) / bays + R(-0.15, 0.15), ty = height + 0.04;
      topItem(cx, ty, depth);
    }
  }
  // 側板の分類札（両端の外側）
  if (opt.ndc !== false) {
    const n = RI(0, NDC.length - 1);
    for (const s of [-1, 1]) {
      B.at(s * (len / 2 + 0.002), height - 0.32, depth / 2 - 0.16, s * PI / 2, () => ndcPlate(n));
    }
  }
}
// 天板に置くもの（重み付きの表）
function topItem(x, y, depth) {
  const r = rnd();
  if (r < 0.32) {             // 寝かせて積んだ本
    let yy = y; const n = RI(2, 5), w = R(0.18, 0.26), dd = Math.min(depth - 0.05, R(0.14, 0.22));
    for (let k = 0; k < n; k++) { const t = R(0.025, 0.045); book(x + R(-0.015, 0.015), yy + t / 2, 0, w, t, dd, 0, R(-0.15, 0.15)); yy += t; }
  } else if (r < 0.52) {      // 資料の箱
    B.block('plain', pick([0xb59a6e, 0xc8b48c, 0x8f7a5a, 0x6e6a60]), R(0.25, 0.4), R(0.14, 0.24), depth * 0.8, x, y, 0, R(-0.1, 0.1));
  } else if (r < 0.64) {      // 鉢植え
    B.cyl('plain', 0xa0603a, 0.07, 0.12, x, y + 0.06, 0);

  } else if (r < 0.74) {      // 地球儀
    B.cyl('wood', 0x4a3020, 0.06, 0.02, x, y + 0.01, 0);
    B.tube('metal', C.brass, 0.008, new THREE.Vector3(x, y, 0), new THREE.Vector3(x, y + 0.2, 0));
    B.sphere('plain', 0x6a8aa0, 0.11, 0.11, 0.11, x, y + 0.24, 0);

    for (let k = 0; k < RI(2, 4); k++) B.cyl('plain', pick([0xe0d6c0, 0xd8cba6, 0xc8b890]), 0.035, R(0.5, 0.7), x + R(-0.1, 0.1), y + 0.035 + k * 0.02, R(-0.05, 0.05), 0, R(-0.3, 0.3), PI / 2);
  } else {                    // 本立てと立てた本
    B.block('metal', 0x2a2a2a, 0.02, 0.16, 0.12, x - 0.12, y, 0);
    let u = x - 0.1; for (let k = 0; k < RI(3, 6); k++) { const w = R(0.02, 0.04), h = R(0.18, 0.26); book(u + w / 2, y + h / 2, 0, w, h, R(0.13, 0.18)); u += w; }
    B.block('metal', 0x2a2a2a, 0.02, 0.16, 0.12, u + 0.01, y, 0);
  }
}

function bareTree(x, z, H) {
  const y = groundH(x, z) - 0.2;
  const branch = (p, dir, len, r, depth) => {
    const q = p.clone().addScaledVector(dir, len);
    B.tube('wood', 0x3a3028, r, p, q, GEO.cyl6);
    if (depth > 0 && dir.y > 0.2 && r > 0.02) B.tube('snow', SNOW_COL, r * 0.9, p.clone().add(new THREE.Vector3(0, r * 0.9, 0)), q.clone().add(new THREE.Vector3(0, r * 0.9, 0)), GEO.cyl6);
    if (depth === 0) return;
    const n = depth > 2 ? 2 : 3;
    for (let i = 0; i < n; i++) {
      const d = dir.clone().add(new THREE.Vector3(R(-0.8, 0.8), R(0.1, 0.6), R(-0.8, 0.8))).normalize();
      branch(q, d, len * R(0.55, 0.75), r * 0.62, depth - 1);
    }
  };
  branch(new THREE.Vector3(x, y, z), new THREE.Vector3(0, 1, 0), H * 0.35, 0.12 + H * 0.01, 4);
}

        play(BUF.thud, new THREE.Vector3(x, 0.5, x < MAIN.x0 ? WING.z1 + 0.7 : x > STACK.x0 ? STACK.z1 + 0.4 : MAIN.z1 + 0.9), 0, 0.6, 5, camZone);
      }
      // バス：止まるときのエアブレーキ、扉の開け閉め
      const p = (((T + 52) % 84) + 84) % 84, pl = (((lastT + 52) % 84) + 84) % 84;
      const at = (e) => pl < e && p >= e;
      if (at(19.2)) play(BUF.psh, bp, 0, 0.35, 5, camZone);
      if (at(21) || at(29.5)) play(BUF.clunk, bp, 0, 0.3, 5, camZone);
    }
    lastT = T;
  }

  async function toggle() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      BUF = build(ctx);
    }
    on = !on;
    const now = ctx.currentTime;
    if (on) {
      await ctx.resume();
      master.gain.cancelScheduledValues(now); master.gain.setTargetAtTime(0.3, now, 0.3);
    } else {
      master.gain.cancelScheduledValues(now); master.gain.setTargetAtTime(0, now, 0.05);
      setTimeout(() => { if (!on) ctx.suspend(); }, 400);
    }
    return on;
  }
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else if (on) ctx.resume();
  });
  // 確かめ用：素材を作って、大きさと NaN の有無を返す（音は出さない）
  function selfTest(SR = 48000) {
    const B = makeBank(SR), outp = {};
    const st = (a) => { let m = 0, s = 0, bad = 0; for (const v of a) { if (!Number.isFinite(v)) bad++; m = Math.max(m, Math.abs(v)); s += v * v; } return { peak: +m.toFixed(3), rms: +Math.sqrt(s / a.length).toFixed(3), sec: +(a.length / SR).toFixed(2), bad }; };
    for (const k in B) outp[k] = (Array.isArray(B[k]) ? B[k] : [B[k]]).map(st);
    return outp;
  }
  // 確かめ用：出口の大きさを測る
  function probe() {
    if (!ctx) return null;
    const an = ctx.createAnalyser(); an.fftSize = 2048; master.connect(an);
    return new Promise((res) => setTimeout(() => { const a = new Float32Array(an.fftSize); an.getFloatTimeDomainData(a); let s = 0; for (const v of a) s += v * v; res({ state: ctx.state, rms: Math.sqrt(s / a.length) }); }, 1500));
  }
  return { toggle, update, selfTest, makeBank, probe, isOn: () => on };
})();

// ============================================================
// 動かす
// ============================================================
const T_START = performance.now();
const clock = { getElapsedTime: () => (performance.now() - T_START) / 1000 };
const look = new THREE.Vector3(), fwd = new THREE.Vector3(), tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const db = renderer.getDrawingBufferSize(new THREE.Vector2());
  post.resize(db.x, db.y);
}
addEventListener('resize', resize);
resize();
applyView(START_VIEW);
if (Q.get('follow') === '1') setFollow(true);

function camZoneOf(p) {
  for (let k = 0; k < 3; k++) {
    const a = ZU.uZMin.value[k], b = ZU.uZMax.value[k], r = ZU.uZRoof.value[k];
    if (p.x > a.x && p.y > a.y && p.z > a.z && p.x < b.x && p.y < b.y && p.z < b.z && p.y < r.x - r.z * Math.abs(p.z - r.y)) return r.w;
  }
  return 0;
}

const SOUND_WALKERS_LIST = [...WALKERS, ROAD_W];
const state = { frames: 0, ready: false };
window.__lib = state;
state.sound = SOUND;
let DT = 1 / 60, lastFrame = performance.now();
// 重い端末では描画の倍率を下げ、軽ければ戻す（1.5 秒ごとに判定）
const SCALER = { scale: 1, acc: 0, n: 0, t0: performance.now() };
function autoScale(ms) {
  if (FIXED_T !== null) return;
  SCALER.acc += ms; SCALER.n++;
  const now = performance.now();
  if (now - SCALER.t0 < 1500) return;
  const avg = SCALER.acc / SCALER.n; SCALER.acc = 0; SCALER.n = 0; SCALER.t0 = now;
  let s = SCALER.scale;
  if (avg > 21) s = Math.max(0.55, s - 0.1); else if (avg < 15.5) s = Math.min(1, s + 0.08);
  if (Math.abs(s - SCALER.scale) > 1e-3) { SCALER.scale = s; renderer.setPixelRatio(DPR * s); resize(); }
}
function frame() {
  const nowMs = performance.now();
  if (state.frames > 30) autoScale(nowMs - lastFrame);
  DT = Math.min(0.1, (nowMs - lastFrame) / 1000); lastFrame = nowMs;
  const T = FIXED_T !== null ? FIXED_T : clock.getElapsedTime();
  // 手を離して 4 秒たったら、ゆっくり元の構図へ戻る
  if (nowMs - lastInput > 4000 && !drag0()) {
    const k = 1 - Math.exp(-DT * 0.6);
    yaw -= yaw * k; pitch -= pitch * k; zoom += (1 - zoom) * k;
  }
  // 縦長の画面では引いて（または画角を広げて）、横が切れないようにする
  const portrait = Math.pow(Math.max(1, 1.35 / camera.aspect), 0.85);
  ZU.uTime.value = T;
  const v = follow ? FOLLOW_VIEW : VIEWS[cur];
  trans += (transTarget - trans) * (1 - Math.exp(-DT * 9));
  if (FIXED_T !== null) trans = transTarget;

  // --- カメラ ---
  const tv = T - (FIXED_T !== null ? 0 : viewT0);
  const zf = zoom;
  const fovP = (f, k = portrait) => Math.min(80, THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(f) / 2) * k)));
  if (follow) {
    const w = VISITOR, p = w.p.root.position;
    const visible = w.p.root.visible;
    // 見えている間は、向きの少し後ろ上から。降りる前は停留所で待つ
    const f = new THREE.Vector3(Math.sin(w.face), 0, Math.cos(w.face));
    // 停留所から道沿いに歩くあいだは前に回って振り返り（後ろにバスと停留所）、玄関へ曲がったら後ろから
    const L01 = w.seg[0] + w.seg[1];
    const ahead = !visible || (w.sgn > 0 && w.d < L01 - 1.5);
    let q = p, fv = f;
    if (!visible) { q = w.pts[0].clone().setY(groundH(w.pts[0].x, w.pts[0].z)); fv = new THREE.Vector3().subVectors(w.pts[1], w.pts[0]).setY(0).normalize(); }
    const side = new THREE.Vector3(fv.z, 0, -fv.x);
    const want = !visible ? new THREE.Vector3(2.0, 1.9, 11.9)
      : ahead ? q.clone().addScaledVector(fv, 3.0).addScaledVector(side, 1.0) : q.clone().addScaledVector(fv, -3.0).addScaledVector(side, 0.6);
    want.z = Math.min(want.z, 11.9);
    want.y = Math.max(groundH(want.x, want.z) + 1.4, q.y + (ahead ? 1.75 : 2.1));
    const wantLook = !visible ? new THREE.Vector3(12.6, 1.4, 11.6) : ahead ? q.clone().setY(q.y + 1.25) : q.clone().addScaledVector(fv, 1.6).setY(q.y + 1.3);
    const k = FIXED_T !== null ? 1 : 1 - Math.exp(-DT * 1.6);
    FOLLOW.pos.lerp(want, k); FOLLOW.look.lerp(wantLook, k);
    camera.position.copy(FOLLOW.pos);
    fwd.subVectors(FOLLOW.look, FOLLOW.pos); const dist = fwd.length(); fwd.normalize();
    const az = Math.atan2(fwd.x, fwd.z) + yaw, el = Math.asin(fwd.y) + pitch;
    look.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)).multiplyScalar(dist).add(camera.position);
    camera.lookAt(look);
    camera.fov = fovP(46 * zf);
    FOLLOW_VIEW.focus = visible ? camera.position.distanceTo(p) : 9;
    // 玄関で姿が消えたら、閲覧室へ
    if (FOLLOW.lastState === 'walk' && w.state === 'in') setTimeout(() => { if (follow) go(3); }, 1200);
    FOLLOW.lastState = w.state;
  } else if (v.mode === 'orbit') {
    tmp.subVectors(camState.pos, camState.tgt);
    // 縦長では、引く量と画角を半分ずつ。引いた分だけ霧を薄めて、遠のいても沈まないようにする
    const pr = Math.sqrt(portrait);
    const r = tmp.length() * zf * pr;
    scene.fog.density = v.fog / pr;
    let az = Math.atan2(tmp.x, tmp.z) + yaw + Math.sin(T * 0.035) * 0.16;
    let el = Math.asin(tmp.y / tmp.length()) + pitch;
    el = clamp(el, 0.12, 1.25);
    camera.position.set(camState.tgt.x + r * Math.cos(el) * Math.sin(az), camState.tgt.y + r * Math.sin(el), camState.tgt.z + r * Math.cos(el) * Math.cos(az));
    camera.lookAt(camState.tgt);
    camera.fov = fovP(v.fov, pr);
  } else {
    camera.position.copy(camState.pos);
    camera.position.x += Math.sin(T * 0.21) * 0.05; camera.position.y += Math.sin(T * 0.17 + 1) * 0.03;
    fwd.subVectors(camState.tgt, camState.pos);
    const dist = fwd.length(); fwd.normalize();
    const az = Math.atan2(fwd.x, fwd.z) + yaw + Math.sin(T * 0.05) * 0.03;
    const el = Math.asin(fwd.y) + pitch;
    look.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)).multiplyScalar(dist).add(camera.position);
    camera.lookAt(look);
    camera.fov = fovP(v.fov * zf);
  }
  camera.updateProjectionMatrix();
  const focusDist = v.focus ?? camera.position.distanceTo(v.mode === 'orbit' ? camState.tgt : look);
  post.cocU.uFocus.value = focusDist;
  post.cocU.uAuto.value = v.focus === undefined ? 1 : 0;
  snowU.uAuto.value = post.cocU.uAuto.value;
  snowU.tFocus.value = post.rFocus[post.fi].texture;
  // ボケの大きさは画面の高さ（描画の画素）に比例させる。視点の値は 720 画素の高さで合わせてある
  const hs = post.h / 720;
  post.cocU.uAperture.value = (v.ap + trans * 30) * hs;
  post.cocU.uMaxCoc.value = Math.min(22, (11 + trans * 11) * hs);
  post.mFinal.uniforms.uExposure.value = (follow ? VIEWS[1].exp : v.exp) * (1 - 0.3 * trans);
  const camZone = camZoneOf(camera.position);
  CAM_ZONE.value = camZone;
  const db = post.h;
  snowU.uPx.value = db / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  snowU.uCam.value.copy(camera.position);
  snowU.uFocus.value = focusDist;
  snowU.uAperture.value = (v.ap + trans * 30) * 2 * hs;
  snowU.uFogD.value = scene.fog.density;
  snowNear.visible = camZone === 0;
  haloMesh.material.uniforms.uFogD.value = scene.fog.density;

  // --- 灯りのゆらぎ ---
  const fl = 0.78 + 0.14 * Math.sin(T * 9.1) + 0.08 * Math.sin(T * 23.7 + 1.3) + 0.06 * Math.sin(T * 3.3);
  stoveLight.intensity = stoveLight.userData.base * fl;
  stoveFire.material.color.setRGB(6 * fl, 2.4 * fl, 0.6 * fl);
  // 入口の蛍光灯：古い管が、ときどき数回またたく
  {
    const n = Math.floor(T / 7), f = T - n * 7, on = hash2(n, 17) < 0.35 && f < 0.9 ? (Math.sin(f * 47) > 0.1 ? 1 : 0.15) : 1;
    entLight.intensity = entLight.userData.base * on;
    entTube.material.color.setRGB(3.2 * on, 3.6 * on, 3.4 * on);
  }
  for (const kb of KBULBS) {
    const sw = Math.sin(T * 0.9 + kb.seed) * 0.05;
    kb.g.rotation.z = sw; kb.g.rotation.x = Math.sin(T * 0.7 + kb.seed) * 0.03;
    const px = kb.x + Math.sin(sw) * (kb.len + 0.1), py = kb.top - Math.cos(sw) * (kb.len + 0.1);
    kb.l.position.set(px, py, kb.z + Math.sin(kb.g.rotation.x) * kb.len);
  }

  // --- 時計 ---
  const sec = 17 * 3600 + 12 * 60 + T;
  clockParts.minHand.rotation.z = -((sec / 3600) % 1) * TAU;
  clockParts.hourHand.rotation.z = -((sec / 43200) % 1) * TAU;
  clockParts.pend.rotation.z = Math.sin(T * PI) * 0.12;
  updateClockText(T);

  // --- 人 ---
  for (const w of WALKERS) w.update(T, DT);
  for (const s of SEATED) s.fn(s.p, T);
  {
    const L = BASE.x1 - BASE.x0 + 8, x = BASE.x0 - 4 + ((T * 1.05 + 30) % L);
    roadWalker.root.position.set(x, groundH(x, 16.3) - 0.03, 16.3);
    roadWalker.root.rotation.y = PI / 2;
    poseWalk(roadWalker, x * 4.2, 1);
    ROAD_W.ph = x * 4.2;
  }
  {
    const c = (T * 0.5) % 1, k = Math.sin(c * TAU);
    shoveler.body.rotation.x = 0.35 + 0.25 * Math.max(0, k);
    shoveler.arms[0].rotation.x = shoveler.arms[1].rotation.x = -0.7 - 0.35 * Math.max(0, -k);
    shoveler.body.rotation.y = 0.25 * Math.max(0, -k);
    shoveler.legs[0].hip.rotation.x = -0.25; shoveler.legs[0].knee.rotation.x = 0.35;
    shoveler.legs[1].hip.rotation.x = 0.15;
  }
  catBody.scale.y = 1 + Math.sin(T * 1.6) * 0.04;
  updateHouseWindows(T);
  const SOUND_WALKERS = SOUND_WALKERS_LIST;

  // --- バス ---
  const bs = busState(T);
  bus.position.set(bs.x, 0.05, 13.4);
  bus.visible = bs.on;
  busLight.intensity = bs.on ? 60 : 0;
  for (const bm of busBeams) bm.material.uniforms.uOn.value = bs.on ? 1 : 0;
  const hx = bs.x + 3.65, inBase = (x) => (x > BASE.x0 && x < BASE.x1 ? 1 : 0);
  if (SOUND.isOn()) SOUND.update(T, camZone, { bus: bs, walkers: SOUND_WALKERS, shovelPos: shoveler.root.position, pagePos: PAGE_P.root.position, duck: trans });
  for (const e of busScat) {
    e.p.set(hx + 0.4, 0.77, 13.4 + e.bus * 0.82);
    const on = bs.on && inBase(hx) ? 1 : 0;
    e.fixed.setRGB(2.2 * on, 2.0 * on, 1.7 * on);
  }
  busHaloL.position.set(hx, 0.77, 13.4 - 0.82); busHaloR.position.set(hx, 0.77, 13.4 + 0.82);
  busHaloL.visible = busHaloR.visible = bs.on && inBase(hx);
  busTail[0].position.set(bs.x - 3.65, 0.9, 13.4 - 0.95); busTail[1].position.set(bs.x - 3.65, 0.9, 13.4 + 0.95);
  for (const t of busTail) t.visible = bs.on && inBase(bs.x - 3.65);
  for (const h of dynHalos) h.material.uniforms.uFogD.value = scene.fog.density;
  snowU.uLP.value[NSL - 1].set(hx + 2.5, 1.0, 13.4);
  snowU.uLC.value[NSL - 1].set(bs.on ? 0.9 : 0, bs.on ? 0.85 : 0, bs.on ? 0.75 : 0);
  snowU.uLR.value[NSL - 1] = 5;

  camera.updateMatrixWorld();
  const cu = post.camU;
  cu.uInvProj.value.copy(camera.projectionMatrixInverse); cu.uProj.value.copy(camera.projectionMatrix);
  cu.uCamWorld.value.copy(camera.matrixWorld); cu.uViewProj.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  cu.uCamPos.value.copy(camera.position);
  post.scatU.uFogD.value = scene.fog.density;
  // 霧の光の強さは霧の濃さに比例（屋内は空気のかすみ程度）
  post.scatU.uScatter.value = QUALITY ? (v.scatter ?? 0.011) * (scene.fog.density / 0.02) : 0;
  uploadScatter(camZone, v.mode === 'orbit' ? camState.tgt : look);
  post.render();
  state.frames++;
  if (state.frames === 2) {
    document.getElementById('loading').style.opacity = 0;
    fade.style.opacity = 0;
    state.ready = true;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
